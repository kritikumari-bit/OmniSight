
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OmniSight Mock Shop</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background: #f4f4f4;
        }

        .checkout-card {
            max-width: 400px;
            margin: 40px auto;
            padding: 24px;
            background: white;
            border-radius: 12px;
        }

        .checkout-button {
            width: 100%;
            max-width: 100%;
            box-sizing: border-box; /* Intentional mobile layout bug */
            padding: 14px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
        }
    </style>
</head>

<body>
    <div class="checkout-card">
        <h1>My Shop</h1>
        <p>Wireless Headphones</p>
        <p>Price: ₹1,999</p>
        <button class="checkout-button">Proceed to Checkout</button>
    </div>
</body>
</html>
